version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: monad_bilitz_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monad_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monad_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-monad_bilitz}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-monad_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monad_network

  redis:
    image: redis:7-alpine
    container_name: monad_bilitz_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monad_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monad_bilitz_backend
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - monad_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  monad_network:
    driver: bridge
