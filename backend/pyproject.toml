[project]
name = "signature-move-authority"
version = "0.1.0"
description = "Blockchain-based hierarchical signature authorization system using Celiktas et al.'s Higher-Level Security Scheme"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.18",
    "pydantic-settings>=2.7.0",
    "web3>=7.6.0",
    "numpy>=2.2.0",
    "sympy>=1.13.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "agno>=1.0.0",
    "openai>=1.60.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "python-socketio[asyncio]>=5.11.0",
    "cryptography>=42.0.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "alembic>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
