[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgres]
command=/usr/lib/postgresql/17/bin/postgres -D /var/lib/postgresql/data/pgdata -c config_file=/etc/postgresql/17/main/postgresql.conf
user=postgres
autorestart=true
stdout_logfile=/var/log/postgres.log
stderr_logfile=/var/log/postgres_err.log

[program:redis]
command=/usr/bin/redis-server --protected-mode no
user=redis
autorestart=true
stdout_logfile=/var/log/redis.log
stderr_logfile=/var/log/redis_err.log

[program:backend]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/app
environment=PATH="/app/.venv/bin:%(ENV_PATH)s"
user=root
autorestart=true
stdout_logfile=/var/log/backend.log
stderr_logfile=/var/log/backend_err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
